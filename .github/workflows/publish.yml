name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  build_wheel_sdist:
    # This does the actual wheel building or if triggered manually via the workflow dispatch, or for a tag.
    # this job does NOT publish the wheel
    name: Build wheel on ubuntu-latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: (github.repository == 'GarryBGoode/py_gearworks' && ( startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # get all history for setuptools_scm

      - name: Build sdist and wheel
        shell: bash
        run: |
          pwd
          ls -lR
          python3 -V
          python3 -m pip install --upgrade pip
          python3 -m pip -V
          python3 -m pip install build
          python3 -m build --outdir wheelhouse
          python3 -m pip freeze
          ls -lR

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: artifact # must match the download name in upload_pypi
          path: ./wheelhouse/py_gearworks*.* # store the py_gearworks wheel and sdist

  upload_pypi:
    needs: [build_wheel_sdist]
    runs-on: ubuntu-latest
    # only ever publish for a v* tag; a manual workflow_dispatch run builds but does not publish
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/py-gearworks
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          # unpacks default artifact into dist/
          # if `name: artifact` is omitted, the action will create extra parent dir
          name: artifact
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 #v1.14.2
        with:
          repository-url: https://upload.pypi.org/legacy/
